timeout: 3600s
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build-price-pusher
    args: ["build", "--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/price-pusher:${_TAG}", "--file=infra/price-pusher/onchain/Dockerfile", "."]
  - name: "gcr.io/cloud-builders/docker"
    id: docker-push-price-pusher
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/price-pusher:${_TAG}"]
    waitFor: ["docker-build-price-pusher"]
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_32"
substitutions:
  _REGION: europe-west1
  _REPO_NAME: production-docker-repo
