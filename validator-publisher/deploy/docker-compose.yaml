# Add this service to the compose file of your staking node.
# Replace the digest with the one in the release notes (never a mutable tag).
services:
  validator-publisher:
    image: ghcr.io/astraly-labs/pragma-sdk/validator-publisher@sha256:<digest-from-the-release-notes>
    restart: unless-stopped
    # ORACLE_SIGNER_PRIVATE_KEY=0x..., file readable by the node operator only (chmod 600)
    env_file: ./oracle-signer.env
    volumes:
      # validator-publisher.yaml, written by `pragma-validator init`
      - ./validator-publisher:/config:ro
    ports:
      # health and metrics, keep them off the internet
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    # Same network as the node, so rpc_url can be:
    #   Pathfinder: http://pathfinder:9545/rpc/v0_10
    #   Juno:       http://juno:6060/v0_10
    networks:
      - node
    # ~125 MiB measured with the 5 pilot pairs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

networks:
  node:
    external: true
    # the network your node container is on, e.g. pathfinder_net
    name: pathfinder_net
