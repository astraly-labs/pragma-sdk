[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validator-publisher"
authors = [
    {name = "Pragma", email = "contact@pragma.build"}
]
description = "Pragma oracle publisher for Starknet validators."
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "price-pusher",
    "pragma-sdk",
    "pragma-utils",
    "click>=8.1.0",
    "pydantic>=2.7.4",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "prometheus-client>=0.20",
]
dynamic = ["version"]

[project.urls]
homepage = "https://pragma.build"
repository = "https://github.com/Astraly-Labs/pragma-sdk"
documentation = "https://docs.pragma.build"

[project.scripts]
pragma-validator = "validator_publisher.cli:main"

[tool.hatch.version]
path = "validator_publisher/__init__.py"

[tool.uv.sources]
price_pusher = { path = "../price-pusher" }
pragma_sdk = { path = "../pragma-sdk" }
pragma_utils = { path = "../pragma-utils" }

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "poethepoet>=0.26.1",
    "ruff>=0.4",
    "coverage>=7.2.1",
    "pytest>=7.2.2",
    "pytest-asyncio>=0.21.1",
]

[tool.poe.tasks]
format = "ruff format ."
format_check = "ruff format . --check"
lint = "ruff check ."
test = "coverage run -m pytest -v tests/ -s"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["validator_publisher"]
