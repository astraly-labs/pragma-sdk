---
name: Task - Build & Push Docker Image

on:
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: 3.12.4
  DOCKER_REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build_containers:
    strategy:
      # One image failing (lmax-connector's dead index, a PyPI propagation
      # delay) must not cancel the others: price-pusher is what publishers pull.
      fail-fast: false
      matrix:
        package:
          [pragma-sdk, price-pusher, vrf-listener, checkpointer, lmax-connector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract package version
        run: |
          PKG_PATH=$(echo ${{ matrix.package }} | tr '-' '_')
          export PACKAGE_VERSION=$(grep -o '".*"' ./${{ matrix.package }}/$PKG_PATH/__init__.py | tr -d '"')
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo $PACKAGE_VERSION

      - name: Wait for the package to be installable from PyPI
        if: matrix.package == 'pragma-sdk'
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/pragma-sdk/${PACKAGE_VERSION}/json" > /dev/null; then
              echo "pragma-sdk ${PACKAGE_VERSION} is on PyPI"; exit 0
            fi
            echo "waiting for pragma-sdk ${PACKAGE_VERSION} on PyPI ($i/30)"; sleep 20
          done
          echo "pragma-sdk ${PACKAGE_VERSION} never showed up on PyPI"; exit 1

      - name: Build and push pragma-sdk
        if: matrix.package == 'pragma-sdk'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          build-args: |
            PRAGMA_PACKAGE_VERSION=${{ env.PACKAGE_VERSION }}
          target: production
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.package }}:${{ env.PACKAGE_VERSION }}
            ${{ env.DOCKER_REGISTRY}}/${{ matrix.package }}:latest

      - name: Build and push other packages
        if: matrix.package != 'pragma-sdk'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.package }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.package }}:${{ env.PACKAGE_VERSION }}
            ${{ env.DOCKER_REGISTRY}}/${{ matrix.package }}:latest
