name: Release - validator-publisher

# Operators pin the image by digest: no `latest` tag is published.
on:
  push:
    tags:
      - "validator-publisher-v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/validator-publisher

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        run: |
          VERSION=$(grep -o '".*"' validator-publisher/validator_publisher/__init__.py | tr -d '"')
          if [ "${GITHUB_REF_NAME}" != "validator-publisher-v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match validator-publisher-v${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v4

      - name: Tests
        working-directory: validator-publisher
        run: |
          uv sync --frozen
          uv run poe test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validator-publisher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image, pin it by digest:

              ${IMAGE}@${DIGEST}

          Verify the signature before deploying:

              cosign verify ${IMAGE}@${DIGEST} \\
                --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/validator-publisher-release.yml@refs/tags/validator-publisher-v' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com

          Upgrade and rollback: validator-publisher/RUNBOOK.md.
          EOF
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "validator-publisher v${VERSION}" --notes-file notes.md
